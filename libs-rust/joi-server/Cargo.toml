[package]
name = "joi-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable JOI application server runtime"

[dependencies]
axum = "0.8"
getrandom = "0.3"
joi-base = { path = "../joi-base" }
joi-error = { path = "../joi-error" }
joi-plugin = { path = "../joi-plugin" }
ksuid = "0.2"
redb = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tantivy = "0.26"
tempfile = "3"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tower-http = { version = "0.6", features = ["compression-zstd"] }
yaml_serde = "0.10"

[dev-dependencies]
bincode = { version = "2", features = ["serde"] }
criterion = "0.8.2"
flatbuffers = "25"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "attribute_columns"
harness = false
