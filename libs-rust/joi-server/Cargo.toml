[package]
name = "joi-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable JOI application server runtime"

[dependencies]
axum = "0.8"
getrandom = "0.3"
joi-base = { path = "../joi-base" }
joi-error = { path = "../joi-error" }
joi-plugin = { path = "../joi-plugin" }
ksuid = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread"] }
yaml_serde = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "query_total_count"
harness = false
