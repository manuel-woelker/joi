[package]
name = "joix-tickets"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Integration testbed for JOI libraries"
publish = false

[dependencies]
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
