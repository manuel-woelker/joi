[package]
name = "joix-tickets"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Integration testbed for JOI libraries"
publish = false

[dependencies]
axum = "0.8"
joi-base = { path = "../../libs-rust/joi-base" }
joi-error = { path = "../../libs-rust/joi-error" }
joi-plugin = { path = "../../libs-rust/joi-plugin" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread"] }
yaml_serde = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
